let currentLang = 'tr';

function buildMenu(lang) {
  const t = T[lang];
  const tabsEl = document.getElementById('cat-tabs');
  const bodyEl = document.getElementById('menu-body');
  tabsEl.innerHTML = '';
  bodyEl.innerHTML = '';
  MENU.forEach((cat, i) => {
    const btn = document.createElement('button');
    btn.className = 'cat-tab' + (i === 0 ? ' active' : '');
    btn.textContent = t.cats[i];
    btn.onclick = () => {
      document.querySelectorAll('.cat-tab').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.category').forEach(c => c.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('cat-' + cat.key).classList.add('active');
    };
    tabsEl.appendChild(btn);
    const catDiv = document.createElement('div');
    catDiv.id = 'cat-' + cat.key;
    catDiv.className = 'category' + (i === 0 ? ' active' : '');
    cat.sections.forEach(sec => {
      const st = document.createElement('div');
      st.className = 'section-title';
      st.textContent = sec.title[lang];
      catDiv.appendChild(st);
      const card = document.createElement('div');
      card.className = 'section-card';
      sec.items.forEach(item => {
        const row = document.createElement('div');
        row.className = 'item';
        row.innerHTML = `<img class="item-img" src="${item.imgs[0]}" alt="${item.name[lang]}" loading="lazy"><div class="item-info"><div class="item-name">${item.name[lang]}</div><div class="item-desc">${item.desc[lang]}</div></div><div class="item-right"><div class="item-price">${item.price}</div><div class="item-arrow">›</div></div>`;
        row.onclick = () => openDetail(item);
        card.appendChild(row);
      });
      catDiv.appendChild(card);
    });
    bodyEl.appendChild(catDiv);
  });
}

function openDetail(item) {
  const lang = currentLang;
  const l = T[lang].labels;
  const d = item.detail;
  document.getElementById('back-text').textContent = T[lang].back;
  const photosHtml = item.imgs.map((src, i) =>
    `<img class="detail-photo" src="${src}" alt="${item.name[lang]}" loading="lazy" style="${i===0?'width:100%;height:240px;':'width:160px;height:160px;'}">`
  ).join('');
  const nutr = d.nutrition;
  const nutRows = [
    {val: nutr.calories, unit:'kcal', label: l.calories},
    {val: nutr.protein+'g', unit:'', label: l.protein},
    {val: nutr.carbs+'g', unit:'', label: l.carbs},
    {val: nutr.fat+'g', unit:'', label: l.fat},
    {val: nutr.sugar+'g', unit:'', label: l.sugar},
    {val: nutr.fiber+'g', unit:'', label: l.fiber},
  ];
  const nutHtml = nutRows.map(n => `<div class="nut-card"><div class="nut-val">${n.val}${n.unit}</div><div class="nut-label">${n.label}</div></div>`).join('');
  const tagsHtml = d.tags[lang].map(t => `<span class="detail-tag">${t}</span>`).join('');
  const allergensHtml = d.allergens[lang].map(a => `<span class="allergen-tag">⚠ ${a}</span>`).join('');
  document.getElementById('detail-content').innerHTML = `
    <div class="detail-photos">${photosHtml}</div>
    <div class="detail-body">
      <div class="detail-name">${item.name[lang]}</div>
      <div class="detail-tagline">${item.desc[lang]}</div>
      <div class="detail-price-row">
        <div class="detail-price">${item.price}</div>
        <div class="detail-badge">Bear Café</div>
      </div>
      <div class="detail-section">
        <div class="detail-section-title">${l.description}</div>
        <div class="detail-desc">${d.description[lang]}</div>
      </div>
      <div class="detail-section">
        <div class="detail-section-title">${l.brand}</div>
        <div class="detail-desc">${d.brand[lang]}</div>
      </div>
      <div class="detail-section">
        <div class="detail-section-title">${l.origin}</div>
        <div class="detail-desc">${d.origin[lang]}</div>
      </div>
      <div class="detail-section">
        <div class="detail-section-title">${l.nutrition}</div>
        <div class="nutrition-grid">${nutHtml}</div>
      </div>
      <div class="detail-section">
        <div class="detail-section-title">${l.ingredients}</div>
        <div class="detail-tags">${tagsHtml}</div>
      </div>
      <div class="detail-section">
        <div class="detail-section-title">${l.allergens}</div>
        <div class="allergen-row">${allergensHtml}</div>
      </div>
    </div>`;
  document.getElementById('menu-wrap').style.display = 'none';
  document.getElementById('detail-page').style.display = 'block';
  window.scrollTo(0,0);
}

document.getElementById('detail-back').onclick = () => {
  document.getElementById('detail-page').style.display = 'none';
  document.getElementById('menu-wrap').style.display = 'block';
  window.scrollTo(0,0);
};

function setLang(lang) {
  currentLang = lang;
  localStorage.setItem('bear_lang', lang);
  document.getElementById('lang-overlay').style.display = 'none';
  document.getElementById('menu-wrap').style.display = 'block';
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
  document.body.className = lang === 'ar' ? 'ar' : '';
  document.getElementById('hero-sub').textContent = T[lang].heroSub;
  document.getElementById('wifi-label').textContent = T[lang].wifi;
  buildMenu(lang);
}

window.addEventListener('DOMContentLoaded', () => {
  const saved = localStorage.getItem('bear_lang');
  if (saved) setLang(saved);
});
