<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=DM+Sans:wght@300;400;500&family=Noto+Sans+Arabic:wght@400;500&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#f5f0e8;font-family:'DM Sans',sans-serif;min-height:100vh;}
body.ar{font-family:'Noto Sans Arabic',sans-serif;}
#lang-overlay{position:fixed;inset:0;background:#1a1209;display:flex;align-items:center;justify-content:center;z-index:999;flex-direction:column;gap:1.5rem;padding:2rem;}
#lang-overlay h2{font-family:'Playfair Display',serif;color:#f5e6c8;font-size:2rem;text-align:center;}
#lang-overlay p{color:#a8906e;font-size:12px;text-align:center;line-height:1.8;}
.lang-btns{display:flex;gap:1rem;flex-wrap:wrap;justify-content:center;margin-top:.5rem;}
.lang-btn{padding:.85rem 2rem;border-radius:999px;border:1.5px solid #d4a853;background:transparent;color:#f5e6c8;font-size:15px;font-weight:500;cursor:pointer;transition:all .2s;font-family:inherit;}
.lang-btn:hover{background:#d4a853;color:#1a1209;}
.menu-wrap{max-width:440px;margin:0 auto;background:#fdfaf5;min-height:100vh;}
.menu-hero{background:#1a1209;color:#f5e6c8;padding:2.5rem 1.5rem 2rem;text-align:center;border-radius:0 0 2rem 2rem;}
.menu-hero .bear-icon{font-size:3rem;margin-bottom:.5rem;}
.menu-hero h1{font-family:'Playfair Display',serif;font-size:2.2rem;letter-spacing:.03em;margin-bottom:.25rem;}
.menu-hero p{font-size:11px;color:#a8906e;letter-spacing:.12em;text-transform:uppercase;}
.cat-tabs{display:flex;gap:8px;padding:1.25rem 1.25rem .5rem;overflow-x:auto;scrollbar-width:none;}
.cat-tabs::-webkit-scrollbar{display:none;}
.cat-tab{padding:7px 16px;border-radius:999px;font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap;border:1.5px solid #d4a853;color:#a07830;background:transparent;font-family:inherit;transition:all .2s;}
.cat-tab.active{background:#1a1209;color:#f5e6c8;border-color:#1a1209;}
.category{display:none;padding-bottom:1rem;}
.category.active{display:block;}
.section-title{font-family:'Playfair Display',serif;font-size:1.05rem;color:#1a1209;padding:1rem 1.5rem .5rem;font-weight:600;}
.section-card{background:#fff;border-radius:1rem;margin:0 1rem;border:.5px solid #e8ddd0;overflow:hidden;}
.item{display:flex;align-items:center;padding:.75rem 1.25rem;gap:12px;border-bottom:.5px solid #f0e8dc;cursor:pointer;transition:background .15s;}
.item:hover{background:#fdf7f0;}
.item:last-child{border-bottom:none;}
.item-img{width:64px;height:64px;border-radius:10px;object-fit:cover;flex-shrink:0;background:#f0e8dc;}
.item-info{flex:1;min-width:0;}
.item-name{font-size:14px;font-weight:500;color:#1a1209;margin-bottom:2px;}
.item-desc{font-size:12px;color:#8a7560;line-height:1.4;}
.item-right{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0;}
.item-price{font-size:14px;font-weight:600;color:#a07830;white-space:nowrap;}
.item-arrow{font-size:12px;color:#c8b49a;}
.wifi-box{margin:1rem;background:#fff;border-radius:1rem;border:.5px solid #e8ddd0;padding:1rem 1.25rem;text-align:center;}
.wifi-box .wifi-icon{font-size:1.5rem;margin-bottom:6px;}
.wifi-box .wifi-label{font-size:11px;color:#a8906e;text-transform:uppercase;letter-spacing:.1em;margin-bottom:6px;}
.wifi-box .wifi-name{font-size:14px;font-weight:500;color:#1a1209;margin-bottom:2px;}
.wifi-box .wifi-pass{font-size:13px;color:#a07830;font-weight:600;letter-spacing:.08em;}
.footer{text-align:center;padding:1rem;font-size:11px;color:#b0a090;}
#detail-page{display:none;max-width:440px;margin:0 auto;background:#fdfaf5;min-height:100vh;}
.detail-back{display:flex;align-items:center;gap:8px;padding:1rem 1.25rem;cursor:pointer;color:#a07830;font-size:14px;font-weight:500;background:#fff;border-bottom:.5px solid #e8ddd0;}
.detail-back:hover{background:#fdf7f0;}
.detail-photos{display:flex;gap:8px;padding:1rem;overflow-x:auto;scrollbar-width:none;}
.detail-photos::-webkit-scrollbar{display:none;}
.detail-photo{width:200px;height:200px;border-radius:14px;object-fit:cover;flex-shrink:0;}
.detail-photo:first-child{width:100%;height:240px;flex-shrink:0;}
.detail-body{padding:0 1rem 2rem;}
.detail-name{font-family:'Playfair Display',serif;font-size:1.6rem;color:#1a1209;margin-bottom:.25rem;margin-top:1rem;}
.detail-tagline{font-size:13px;color:#8a7560;margin-bottom:1rem;}
.detail-price-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.25rem;}
.detail-price{font-size:1.4rem;font-weight:600;color:#a07830;}
.detail-badge{background:#1a1209;color:#f5e6c8;font-size:11px;padding:4px 12px;border-radius:999px;}
.detail-section{margin-bottom:1.25rem;}
.detail-section-title{font-size:12px;font-weight:500;color:#a8906e;text-transform:uppercase;letter-spacing:.1em;margin-bottom:.6rem;}
.detail-desc{font-size:14px;color:#3a2e24;line-height:1.7;}
.detail-tags{display:flex;flex-wrap:wrap;gap:6px;}
.detail-tag{background:#f5f0e8;border:.5px solid #e0d4c0;border-radius:999px;padding:4px 12px;font-size:12px;color:#6a5a45;}
.nutrition-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.nut-card{background:#fff;border:.5px solid #e8ddd0;border-radius:10px;padding:.6rem;text-align:center;}
.nut-val{font-size:16px;font-weight:600;color:#1a1209;}
.nut-label{font-size:10px;color:#a8906e;margin-top:2px;}
.allergen-row{display:flex;flex-wrap:wrap;gap:6px;}
.allergen-tag{background:#fff3e0;border:.5px solid #f0c060;border-radius:6px;padding:3px 10px;font-size:11px;color:#8a5a00;}
.waiter-btn{display:flex;align-items:center;justify-content:center;gap:10px;margin:0 1rem 1rem;padding:1rem;background:#1a1209;color:#f5e6c8;border:none;border-radius:1rem;font-size:15px;font-weight:500;cursor:pointer;font-family:inherit;transition:all .2s;width:calc(100% - 2rem);}
.waiter-btn:active{transform:scale(.97);}
#waiter-toast{position:fixed;bottom:2rem;left:50%;transform:translateX(-50%) translateY(80px);background:#1a1209;color:#f5e6c8;padding:.75rem 1.5rem;border-radius:999px;font-size:13px;font-weight:500;z-index:9999;transition:transform .35s ease,opacity .35s ease;opacity:0;white-space:nowrap;}
#waiter-toast.show{transform:translateX(-50%) translateY(0);opacity:1;}
.games-section{margin:0 1rem 1.5rem;}
.games-section-title{font-family:'Playfair Display',serif;font-size:1.05rem;color:#1a1209;padding:.75rem 0;font-weight:600;}
.games-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.game-card{background:#fff;border:.5px solid #e8ddd0;border-radius:12px;padding:.75rem .5rem;text-align:center;cursor:pointer;transition:all .2s;}
.game-card:hover,.game-card:active{background:#1a1209;border-color:#1a1209;}
.game-card:hover .gc-name,.game-card:active .gc-name{color:#f5e6c8;}
.game-card:hover .gc-icon,.game-card:active .gc-icon{transform:scale(1.15);}
.gc-icon{font-size:1.8rem;display:block;margin-bottom:4px;transition:transform .2s;}
.gc-name{font-size:12px;font-weight:500;color:#1a1209;}
#game-page{display:none;max-width:440px;margin:0 auto;background:#fdfaf5;min-height:100vh;}
.game-top-bar{display:flex;align-items:center;gap:8px;padding:1rem 1.25rem;cursor:pointer;color:#a07830;font-size:14px;font-weight:500;background:#fff;border-bottom:.5px solid #e8ddd0;}
.game-top-bar:hover{background:#fdf7f0;}
#game-container{padding:1rem;}
.g-title{font-family:'Playfair Display',serif;font-size:1.3rem;color:#1a1209;margin-bottom:.25rem;font-weight:600;}
.g-hint{font-size:11px;color:#a8906e;margin-bottom:.75rem;}
.g-score-row{display:flex;gap:8px;margin-bottom:.75rem;}
.g-score-box{background:#1a1209;color:#f5e6c8;border-radius:8px;padding:4px 14px;text-align:center;}
.g-score-label{font-size:9px;color:#a8906e;text-transform:uppercase;}
.g-score-val{font-size:15px;font-weight:600;}
.g-btns{display:flex;gap:8px;margin-top:10px;}
.g-btn{flex:1;padding:.6rem;border:1.5px solid #d4a853;background:transparent;color:#a07830;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;font-family:inherit;}
.g-btn:hover{background:#1a1209;color:#f5e6c8;border-color:#1a1209;}
.g-msg{text-align:center;padding:.6rem;font-size:13px;font-weight:500;color:#a04020;min-height:24px;}
#board2048{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;background:#c8b49a;padding:6px;border-radius:10px;touch-action:none;}
.c2048{height:68px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:18px;background:#e0d0bc;color:#1a1209;}
.c2048.v2{background:#f5f0e8;}.c2048.v4{background:#f0e6d0;}.c2048.v8{background:#d4a853;color:#fff;}
.c2048.v16{background:#c8843a;color:#fff;}.c2048.v32{background:#b86030;color:#fff;}.c2048.v64{background:#a04020;color:#fff;}
.c2048.v128{background:#8B6914;color:#fff;font-size:15px;}.c2048.v256{background:#7a5c10;color:#fff;font-size:15px;}
.c2048.v512{background:#6a4c0c;color:#fff;font-size:14px;}.c2048.v1024{background:#3a2e24;color:#f5e6c8;font-size:13px;}
.c2048.v2048{background:#1a1209;color:#d4a853;font-size:13px;}
#board-mem{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
.mem-card{height:70px;border-radius:10px;background:#1a1209;display:flex;align-items:center;justify-content:center;font-size:1.8rem;cursor:pointer;transition:all .25s;border:2px solid #3a2e24;user-select:none;}
.mem-card.flipped,.mem-card.matched{background:#f5e6c8;border-color:#d4a853;}
.mem-card.matched{background:#d4a853;cursor:default;}
.mem-back{font-size:1.5rem;}
.mem-front{display:none;}
.mem-card.flipped .mem-front,.mem-card.matched .mem-front{display:block;}
.mem-card.flipped .mem-back,.mem-card.matched .mem-back{display:none;}
#board-snake{display:grid;background:#1a1209;border-radius:10px;overflow:hidden;touch-action:none;}
.sncell{background:#1a1209;}
.sncell.sn{background:#d4a853;border-radius:3px;}
.sncell.food{background:#a04020;border-radius:50%;}
.dpad{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;max-width:160px;margin:.75rem auto 0;}
.dpad-btn{height:44px;background:#fff;border:.5px solid #e8ddd0;border-radius:8px;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:inherit;}
.dpad-btn:active{background:#d4a853;}
#board-tetris{display:grid;background:#1a1209;border-radius:10px;overflow:hidden;}
.tcell{background:#1a1209;}.tcell.filled{border-radius:2px;}
#word-input-row{display:flex;gap:8px;margin-bottom:.75rem;}
#word-input{flex:1;padding:.6rem .8rem;border:1.5px solid #e8ddd0;border-radius:8px;font-size:15px;font-family:inherit;background:#fff;color:#1a1209;text-transform:uppercase;}
#word-input:focus{outline:none;border-color:#d4a853;}
.word-display{display:flex;gap:6px;justify-content:center;margin-bottom:.75rem;}
.letter-box{width:38px;height:42px;border:2px solid #e8ddd0;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:600;color:#1a1209;background:#fff;}
.word-guesses{display:flex;flex-direction:column;gap:6px;margin-bottom:.5rem;}
.guess-row{display:flex;gap:5px;justify-content:center;}
.guess-box{width:34px;height:38px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;color:#fff;}
.guess-box.c{background:#d4a853;}.guess-box.p{background:#c8843a;}.guess-box.w{background:#8a7560;}
.rps-choices{display:flex;justify-content:center;gap:1rem;margin:1rem 0;}
.rps-btn{width:72px;height:72px;border-radius:50%;border:2px solid #e8ddd0;background:#fff;font-size:2rem;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center;}
.rps-btn:hover,.rps-btn:active{border-color:#d4a853;transform:scale(1.1);}
.rps-battle{display:flex;justify-content:center;align-items:center;gap:1.5rem;font-size:3rem;margin:1rem 0;min-height:80px;}
.rps-vs{font-size:14px;font-weight:600;color:#a8906e;}
.rps-result{text-align:center;font-size:16px;font-weight:600;min-height:28px;}
.win{color:#3a8a3a;}.lose{color:#a04020;}.draw{color:#a07830;}
</style>
</head>

let currentLang='tr';
function buildMenu(lang){
  const t=T[lang],tabsEl=document.getElementById('cat-tabs'),bodyEl=document.getElementById('menu-body');
  tabsEl.innerHTML='';bodyEl.innerHTML='';
  MENU.forEach((cat,i)=>{
    const btn=document.createElement('button');
    btn.className='cat-tab'+(i===0?' active':'');btn.textContent=t.cats[i];
    btn.onclick=()=>{document.querySelectorAll('.cat-tab').forEach(b=>b.classList.remove('active'));document.querySelectorAll('.category').forEach(c=>c.classList.remove('active'));btn.classList.add('active');document.getElementById('cat-'+cat.key).classList.add('active');};
    tabsEl.appendChild(btn);
    const catDiv=document.createElement('div');catDiv.id='cat-'+cat.key;catDiv.className='category'+(i===0?' active':'');
    cat.sections.forEach(sec=>{
      const st=document.createElement('div');st.className='section-title';st.textContent=sec.title[lang];catDiv.appendChild(st);
      const card=document.createElement('div');card.className='section-card';
      sec.items.forEach(item=>{
        const row=document.createElement('div');row.className='item';
        row.innerHTML=`<img class="item-img" src="${item.imgs[0]}" alt="${item.name[lang]}" loading="lazy"><div class="item-info"><div class="item-name">${item.name[lang]}</div><div class="item-desc">${item.desc[lang]}</div></div><div class="item-right"><div class="item-price">${item.price}</div><div class="item-arrow">›</div></div>`;
        row.onclick=()=>openDetail(item);card.appendChild(row);
      });
      catDiv.appendChild(card);
    });
    bodyEl.appendChild(catDiv);
  });
}
function openDetail(item){
  const lang=currentLang,l=T[lang].labels,d=item.detail;
  document.getElementById('back-text').textContent=T[lang].back;
  const photosHtml=item.imgs.map((src,i)=>`<img class="detail-photo" src="${src}" alt="${item.name[lang]}" loading="lazy" style="${i===0?'width:100%;height:240px;':'width:160px;height:160px;'}">`).join('');
  const nutr=d.nutrition;
  const nutHtml=[{v:nutr.calories,u:'kcal',l:l.calories},{v:nutr.protein+'g',u:'',l:l.protein},{v:nutr.carbs+'g',u:'',l:l.carbs},{v:nutr.fat+'g',u:'',l:l.fat},{v:nutr.sugar+'g',u:'',l:l.sugar},{v:nutr.fiber+'g',u:'',l:l.fiber}].map(n=>`<div class="nut-card"><div class="nut-val">${n.v}${n.u}</div><div class="nut-label">${n.l}</div></div>`).join('');
  const tagsHtml=d.tags[lang].map(t=>`<span class="detail-tag">${t}</span>`).join('');
  const allergensHtml=d.allergens[lang].map(a=>`<span class="allergen-tag">⚠ ${a}</span>`).join('');
  document.getElementById('detail-content').innerHTML=`<div class="detail-photos">${photosHtml}</div><div class="detail-body"><div class="detail-name">${item.name[lang]}</div><div class="detail-tagline">${item.desc[lang]}</div><div class="detail-price-row"><div class="detail-price">${item.price}</div><div class="detail-badge">Bear Café</div></div><div class="detail-section"><div class="detail-section-title">${l.description}</div><div class="detail-desc">${d.description[lang]}</div></div><div class="detail-section"><div class="detail-section-title">${l.brand}</div><div class="detail-desc">${d.brand[lang]}</div></div><div class="detail-section"><div class="detail-section-title">${l.origin}</div><div class="detail-desc">${d.origin[lang]}</div></div><div class="detail-section"><div class="detail-section-title">${l.nutrition}</div><div class="nutrition-grid">${nutHtml}</div></div><div class="detail-section"><div class="detail-section-title">${l.ingredients}</div><div class="detail-tags">${tagsHtml}</div></div><div class="detail-section"><div class="detail-section-title">${l.allergens}</div><div class="allergen-row">${allergensHtml}</div></div></div>`;
  document.getElementById('menu-wrap').style.display='none';document.getElementById('detail-page').style.display='block';window.scrollTo(0,0);
}
document.getElementById('detail-back').onclick=()=>{document.getElementById('detail-page').style.display='none';document.getElementById('menu-wrap').style.display='block';window.scrollTo(0,0);};
function setLang(lang){
  currentLang=lang;localStorage.setItem('bear_lang',lang);
  document.getElementById('lang-overlay').style.display='none';document.getElementById('menu-wrap').style.display='block';
  document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';document.body.className=lang==='ar'?'ar':'';
  document.getElementById('hero-sub').textContent=T[lang].heroSub;
  document.getElementById('wifi-label').textContent=T[lang].wifi;
  document.getElementById('games-section-title').textContent=T[lang].gamesTitle;
  document.getElementById('game-back-text').textContent=T[lang].gameBack;
  document.getElementById('waiter-btn-text').textContent=T[lang].waiterBtn;
  document.getElementById('gc-memory').textContent=T[lang].gcMemory;
  document.getElementById('gc-snake').textContent=T[lang].gcSnake;
  document.getElementById('gc-word').textContent=T[lang].gcWord;
  document.getElementById('gc-rps').textContent=T[lang].gcRps;
  buildMenu(lang);
}
function callWaiter(){const toast=document.getElementById('waiter-toast');document.getElementById('toast-text').textContent=T[currentLang].waiterToast;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),3000);}
let currentGame=null;
function openGame(id){
  currentGame=id;stopSnake();stopTetris();
  document.getElementById('menu-wrap').style.display='none';document.getElementById('game-page').style.display='block';window.scrollTo(0,0);
  const c=document.getElementById('game-container');c.innerHTML='';
  if(id==='2048')build2048(c);else if(id==='memory')buildMemory(c);else if(id==='snake')buildSnake(c);else if(id==='tetris')buildTetris(c);else if(id==='word')buildWord(c);else if(id==='rps')buildRPS(c);
}
function closeGame(){stopSnake();stopTetris();currentGame=null;document.getElementById('game-page').style.display='none';document.getElementById('menu-wrap').style.display='block';window.scrollTo(0,0);}
/* 2048 */
let g2={grid:null,score:0,best:0,prev:null,prevScore:0,over:false};
function build2048(c){c.innerHTML=`<div class="g-title">🔢 2048</div><div class="g-hint">Kaydır, birleştir, 2048'e ulaş!</div><div class="g-score-row"><div class="g-score-box"><div class="g-score-label">PUAN</div><div class="g-score-val" id="s2048">0</div></div><div class="g-score-box"><div class="g-score-label">EN İYİ</div><div class="g-score-val" id="b2048">0</div></div></div><div id="board2048"></div><div class="g-msg" id="msg2048"></div><div class="g-btns"><button class="g-btn" onclick="init2048()">Yeni Oyun</button><button class="g-btn" onclick="undo2048()">↩ Geri Al</button></div>`;g2.best=parseInt(localStorage.getItem('best2048')||'0');init2048();}
function init2048(){g2.grid=Array(4).fill(null).map(()=>Array(4).fill(0));g2.score=0;g2.over=false;g2.prev=null;addTile2048();addTile2048();draw2048();const m=document.getElementById('msg2048');if(m)m.textContent='';}
function addTile2048(){const empty=[];for(let r=0;r<4;r++)for(let c=0;c<4;c++)if(!g2.grid[r][c])empty.push([r,c]);if(!empty.length)return;const[r,c]=empty[Math.floor(Math.random()*empty.length)];g2.grid[r][c]=Math.random()<0.9?2:4;}
function draw2048(){const b=document.getElementById('board2048');if(!b)return;b.innerHTML='';for(let r=0;r<4;r++)for(let c=0;c<4;c++){const v=g2.grid[r][c];const el=document.createElement('div');el.className='c2048'+(v?' v'+v:'');el.textContent=v||'';b.appendChild(el);}const s=document.getElementById('s2048');if(s)s.textContent=g2.score;g2.best=Math.max(g2.best,g2.score);localStorage.setItem('best2048',g2.best);const bx=document.getElementById('b2048');if(bx)bx.textContent=g2.best;}
function slide2048(row){let arr=row.filter(x=>x);let merged=false;for(let i=0;i<arr.length-1;i++){if(!merged&&arr[i]===arr[i+1]){arr[i]*=2;g2.score+=arr[i];arr.splice(i+1,1);merged=true;}else merged=false;}while(arr.length<4)arr.push(0);return arr;}
function move2048(dir){if(g2.over||!g2.grid)return;g2.prev=g2.grid.map(r=>[...r]);g2.prevScore=g2.score;let moved=false;const G=g2.grid;if(dir==='left'){for(let r=0;r<4;r++){const s=slide2048(G[r]);if(s.join()!==G[r].join())moved=true;G[r]=s;}}else if(dir==='right'){for(let r=0;r<4;r++){const s=slide2048([...G[r]].reverse()).reverse();if(s.join()!==G[r].join())moved=true;G[r]=s;}}else if(dir==='up'){for(let c=0;c<4;c++){const col=[G[0][c],G[1][c],G[2][c],G[3][c]];const s=slide2048(col);s.forEach((v,r)=>{if(G[r][c]!==v)moved=true;G[r][c]=v;});}}else if(dir==='down'){for(let c=0;c<4;c++){const col=[G[0][c],G[1][c],G[2][c],G[3][c]].reverse();const s=slide2048(col).reverse();s.forEach((v,r)=>{if(G[r][c]!==v)moved=true;G[r][c]=v;});}}if(moved){addTile2048();draw2048();check2048Over();}}
function check2048Over(){for(let r=0;r<4;r++)for(let c=0;c<4;c++){if(!g2.grid[r][c])return;if(c<3&&g2.grid[r][c]===g2.grid[r][c+1])return;if(r<3&&g2.grid[r][c]===g2.grid[r+1][c])return;}g2.over=true;const m=document.getElementById('msg2048');if(m)m.textContent='Oyun bitti! Tekrar dene 🐻';}
function undo2048(){if(!g2.prev)return;g2.grid=g2.prev.map(r=>[...r]);g2.score=g2.prevScore;g2.prev=null;g2.over=false;draw2048();const m=document.getElementById('msg2048');if(m)m.textContent='';}
/* MEMORY */
const MEM_EM=['🐻','☕','🍰','🎸','🌸','🦋','🍕','🎮'];
let memCards=[],memFlipped=[],memMatchSet=new Set(),memLock=false,memMoves=0;
function buildMemory(c){c.innerHTML=`<div class="g-title">🃏 Hafıza Kartı</div><div class="g-hint">Eşleşen kartları bul!</div><div class="g-score-row"><div class="g-score-box"><div class="g-score-label">HAMLE</div><div class="g-score-val" id="mem-moves">0</div></div><div class="g-score-box"><div class="g-score-label">KALAN</div><div class="g-score-val" id="mem-left">8</div></div></div><div id="board-mem"></div><div class="g-msg" id="mem-msg"></div><div class="g-btns"><button class="g-btn" onclick="initMemory()">Yeni Oyun</button></div>`;initMemory();}
function initMemory(){memCards=[...MEM_EM,...MEM_EM].sort(()=>Math.random()-.5);memFlipped=[];memMatchSet=new Set();memLock=false;memMoves=0;const m=document.getElementById('mem-msg');if(m)m.textContent='';drawMemory();}
function drawMemory(){const b=document.getElementById('board-mem');if(!b)return;b.innerHTML='';memCards.forEach((em,i)=>{const card=document.createElement('div');card.className='mem-card'+(memMatchSet.has(i)?' matched':'');card.innerHTML=`<span class="mem-back">🐻</span><span class="mem-front">${em}</span>`;if(memFlipped.includes(i)&&!memMatchSet.has(i))card.classList.add('flipped');card.onclick=()=>flipMem(i,card);b.appendChild(card);});const mv=document.getElementById('mem-moves');if(mv)mv.textContent=memMoves;const lf=document.getElementById('mem-left');if(lf)lf.textContent=8-memMatchSet.size/2;}
function flipMem(i,card){if(memLock||memFlipped.includes(i)||memMatchSet.has(i))return;card.classList.add('flipped');memFlipped.push(i);if(memFlipped.length===2){memMoves++;const[a,b2]=memFlipped;if(memCards[a]===memCards[b2]){memMatchSet.add(a);memMatchSet.add(b2);memFlipped=[];memLock=false;const mv=document.getElementById('mem-moves');if(mv)mv.textContent=memMoves;const lf=document.getElementById('mem-left');if(lf)lf.textContent=8-memMatchSet.size/2;document.querySelectorAll('.mem-card')[a].classList.add('matched');document.querySelectorAll('.mem-card')[b2].classList.add('matched');document.querySelectorAll('.mem-card')[a].classList.remove('flipped');document.querySelectorAll('.mem-card')[b2].classList.remove('flipped');if(memMatchSet.size===16){const m=document.getElementById('mem-msg');if(m)m.textContent='🎉 Tebrikler! '+memMoves+' hamlede!';};}else{memLock=true;setTimeout(()=>{const cards=document.querySelectorAll('.mem-card');if(cards[a])cards[a].classList.remove('flipped');if(cards[b2])cards[b2].classList.remove('flipped');memFlipped=[];memLock=false;const mv=document.getElementById('mem-moves');if(mv)mv.textContent=memMoves;},800);}}}
/* SNAKE */
let snakeInterval=null,snake=[],snakeDir={x:1,y:0},snakeFood={x:5,y:5},snakeScore=0,snakeOver=false,snakeNextDir={x:1,y:0};
const SN=15;
function buildSnake(c){c.innerHTML=`<div class="g-title">🐍 Yılan</div><div class="g-hint">Yemi ye, büyü, duvara çarpma!</div><div class="g-score-row"><div class="g-score-box"><div class="g-score-label">PUAN</div><div class="g-score-val" id="sn-score">0</div></div></div><div id="board-snake" style="grid-template-columns:repeat(${SN},1fr);width:100%;aspect-ratio:1/1"></div><div class="g-msg" id="sn-msg"></div><div class="dpad"><div></div><button class="dpad-btn" onclick="snDir(0,-1)">▲</button><div></div><button class="dpad-btn" onclick="snDir(-1,0)">◄</button><div style="background:#fdf7f0;border-radius:8px"></div><button class="dpad-btn" onclick="snDir(1,0)">►</button><div></div><button class="dpad-btn" onclick="snDir(0,1)">▼</button><div></div></div><div class="g-btns"><button class="g-btn" onclick="initSnake()">Yeni Oyun</button></div>`;initSnake();}
function initSnake(){snake=[{x:7,y:7},{x:6,y:7},{x:5,y:7}];snakeDir={x:1,y:0};snakeNextDir={x:1,y:0};snakeScore=0;snakeOver=false;placeSnakeFood();drawSnake();stopSnake();snakeInterval=setInterval(tickSnake,160);const m=document.getElementById('sn-msg');if(m)m.textContent='';}
function stopSnake(){if(snakeInterval){clearInterval(snakeInterval);snakeInterval=null;}}
function placeSnakeFood(){do{snakeFood={x:Math.floor(Math.random()*SN),y:Math.floor(Math.random()*SN)};}while(snake.some(s=>s.x===snakeFood.x&&s.y===snakeFood.y));}
function drawSnake(){const b=document.getElementById('board-snake');if(!b)return;b.innerHTML='';for(let y=0;y<SN;y++)for(let x=0;x<SN;x++){const el=document.createElement('div');const isSn=snake.some(s=>s.x===x&&s.y===y);const isFood=snakeFood.x===x&&snakeFood.y===y;el.className='sncell'+(isSn?' sn':isFood?' food':'');b.appendChild(el);}const s=document.getElementById('sn-score');if(s)s.textContent=snakeScore;}
function snDir(dx,dy){if(dx!==0&&snakeDir.x!==0)return;if(dy!==0&&snakeDir.y!==0)return;snakeNextDir={x:dx,y:dy};}
function tickSnake(){if(snakeOver)return;snakeDir=snakeNextDir;const head={x:snake[0].x+snakeDir.x,y:snake[0].y+snakeDir.y};if(head.x<0||head.x>=SN||head.y<0||head.y>=SN||snake.some(s=>s.x===head.x&&s.y===head.y)){snakeOver=true;stopSnake();const m=document.getElementById('sn-msg');if(m)m.textContent='Oyun bitti! 🐍';return;}snake.unshift(head);if(head.x===snakeFood.x&&head.y===snakeFood.y){snakeScore+=10;placeSnakeFood();}else snake.pop();drawSnake();}
/* TETRIS */
let tetrisInterval=null,tetBoard=[],tetPiece=null,tetScore=0,tetOver=false;
const TW=10,TH=18;
const TSHAPES=[{s:[[1,1,1,1]],c:'#d4a853'},{s:[[1,1],[1,1]],c:'#c8843a'},{s:[[1,1,1],[0,1,0]],c:'#a07830'},{s:[[1,1,1],[1,0,0]],c:'#8B6914'},{s:[[1,1,1],[0,0,1]],c:'#6a4c0c'},{s:[[1,1,0],[0,1,1]],c:'#a04020'},{s:[[0,1,1],[1,1,0]],c:'#b86030'}];
function buildTetris(c){c.innerHTML=`<div class="g-title">🧱 Tetris</div><div class="g-hint">Satırları doldur, puan kazan!</div><div class="g-score-row"><div class="g-score-box"><div class="g-score-label">PUAN</div><div class="g-score-val" id="tet-score">0</div></div></div><div id="board-tetris" style="grid-template-columns:repeat(${TW},1fr);width:100%;aspect-ratio:${TW}/${TH}"></div><div class="g-msg" id="tet-msg"></div><div class="dpad"><div></div><button class="dpad-btn" onclick="rotateTet()">↻</button><div></div><button class="dpad-btn" onclick="tetMove(-1)">◄</button><button class="dpad-btn" onclick="tetDrop()">▼▼</button><button class="dpad-btn" onclick="tetMove(1)">►</button><div></div><div></div><div></div></div><div class="g-btns"><button class="g-btn" onclick="initTetris()">Yeni Oyun</button></div>`;initTetris();}
function initTetris(){tetBoard=Array(TH).fill(null).map(()=>Array(TW).fill(0));tetScore=0;tetOver=false;spawnTet();stopTetris();tetrisInterval=setInterval(tickTetris,450);const m=document.getElementById('tet-msg');if(m)m.textContent='';}
function stopTetris(){if(tetrisInterval){clearInterval(tetrisInterval);tetrisInterval=null;}}
function spawnTet(){const p=TSHAPES[Math.floor(Math.random()*TSHAPES.length)];tetPiece={shape:p.s,color:p.c,x:Math.floor(TW/2)-1,y:0};if(!canTet(tetPiece,0,0)){tetOver=true;stopTetris();const m=document.getElementById('tet-msg');if(m)m.textContent='Oyun bitti! 🧱';}}
function canTet(p,dx,dy){return p.shape.every((row,r)=>row.every((v,c)=>{if(!v)return true;const nx=p.x+c+dx,ny=p.y+r+dy;return nx>=0&&nx<TW&&ny<TH&&(ny<0||!tetBoard[ny][nx]);}));}
function placeTet(){tetPiece.shape.forEach((row,r)=>row.forEach((v,c)=>{if(v&&tetPiece.y+r>=0)tetBoard[tetPiece.y+r][tetPiece.x+c]=tetPiece.color;}));let cleared=0;for(let r=TH-1;r>=0;r--){if(tetBoard[r].every(v=>v)){tetBoard.splice(r,1);tetBoard.unshift(Array(TW).fill(0));cleared++;r++;}}tetScore+=cleared*100;spawnTet();drawTetris();}
function tickTetris(){if(tetOver)return;if(canTet(tetPiece,0,1))tetPiece.y++;else placeTet();drawTetris();}
function tetMove(dx){if(tetOver)return;if(canTet(tetPiece,dx,0))tetPiece.x+=dx;drawTetris();}
function tetDrop(){if(tetOver)return;while(canTet(tetPiece,0,1))tetPiece.y++;placeTet();}
function rotateTet(){if(tetOver)return;const r=tetPiece.shape[0].length,c2=tetPiece.shape.length;const rot=Array(r).fill(null).map((_,i)=>Array(c2).fill(null).map((_,j)=>tetPiece.shape[c2-j-1][i]));const old=tetPiece.shape;tetPiece.shape=rot;if(!canTet(tetPiece,0,0))tetPiece.shape=old;drawTetris();}
function drawTetris(){const b=document.getElementById('board-tetris');if(!b)return;const display=tetBoard.map(r=>[...r]);if(tetPiece)tetPiece.shape.forEach((row,r)=>row.forEach((v,c)=>{if(v&&tetPiece.y+r>=0)display[tetPiece.y+r][tetPiece.x+c]=tetPiece.color;}));b.innerHTML='';display.forEach(row=>row.forEach(v=>{const el=document.createElement('div');el.className='tcell'+(v?' filled':'');if(v)el.style.background=v;b.appendChild(el);}));const s=document.getElementById('tet-score');if(s)s.textContent=tetScore;}
/* WORD */
const WORDS=['KAHVE','BEYAZ','TATLI','EKMEK','ELMAS','LIMON','DENIZ','ORMAN','MASAL','SEFER'];
let wordTarget='',wordGuesses=[],wordOver=false;
function buildWord(c){c.innerHTML=`<div class="g-title">📝 Kelime Bul</div><div class="g-hint">5 harfli Türkçe kelimeyi 6 denemede bul! 🟨=var yanlış yer 🟩=doğru</div><div id="word-guesses" class="word-guesses"></div><div class="g-msg" id="word-msg"></div><div id="word-input-row"><input id="word-input" maxlength="5" placeholder="5 harf..." autocomplete="off" autocorrect="off" autocapitalize="characters"/><button class="g-btn" style="flex:0;padding:.6rem 1rem" onclick="submitWord()">Gir</button></div><div class="g-btns"><button class="g-btn" onclick="initWord()">Yeni Oyun</button></div>`;document.getElementById('word-input').addEventListener('keydown',e=>{if(e.key==='Enter')submitWord();});initWord();}
function initWord(){wordTarget=WORDS[Math.floor(Math.random()*WORDS.length)];wordGuesses=[];wordOver=false;const m=document.getElementById('word-msg');if(m)m.textContent='';const inp=document.getElementById('word-input');if(inp){inp.value='';inp.focus();}drawWordGuesses();}
function drawWordGuesses(){const gu=document.getElementById('word-guesses');if(!gu)return;gu.innerHTML='';wordGuesses.forEach(g=>{const row=document.createElement('div');row.className='guess-row';for(let i=0;i<5;i++){const box=document.createElement('div');let cls='w';if(g[i]===wordTarget[i])cls='c';else if(wordTarget.includes(g[i]))cls='p';box.className='guess-box '+cls;box.textContent=g[i];row.appendChild(box);}gu.appendChild(row);});}
function submitWord(){if(wordOver)return;const inp=document.getElementById('word-input');if(!inp)return;const val=inp.value.toUpperCase().trim();const m=document.getElementById('word-msg');if(val.length!==5){if(m)m.textContent='5 harf giriniz!';return;}wordGuesses.push(val);inp.value='';drawWordGuesses();if(val===wordTarget){if(m)m.textContent='🎉 Tebrikler! Doğru buldunuz!';wordOver=true;return;}if(wordGuesses.length>=6){if(m)m.textContent='Bitti! Kelime: '+wordTarget;wordOver=true;}else{if(m)m.textContent='';}}
/* RPS */
let rpsScore={w:0,l:0,d:0};
function buildRPS(c){c.innerHTML=`<div class="g-title">✊ Taş Kağıt Makas</div><div class="g-hint">Bilgisayara karşı oyna!</div><div class="g-score-row"><div class="g-score-box"><div class="g-score-label">GALİP</div><div class="g-score-val" id="rps-w">0</div></div><div class="g-score-box"><div class="g-score-label">BERAB.</div><div class="g-score-val" id="rps-d">0</div></div><div class="g-score-box"><div class="g-score-label">MAĞLUP</div><div class="g-score-val" id="rps-l">0</div></div></div><div class="rps-choices"><button class="rps-btn" onclick="playRPS('r')" title="Taş">✊</button><button class="rps-btn" onclick="playRPS('p')" title="Kağıt">🖐</button><button class="rps-btn" onclick="playRPS('s')" title="Makas">✌️</button></div><div class="rps-battle" id="rps-battle"><span style="font-size:14px;color:#a8906e">Seçimini yap!</span></div><div class="rps-result" id="rps-result"></div><div class="g-btns"><button class="g-btn" onclick="resetRPS()">Sıfırla</button></div>`;rpsScore={w:0,l:0,d:0};}
function playRPS(choice){const choices=['r','p','s'],cpu=choices[Math.floor(Math.random()*3)];const icons={r:'✊',p:'🖐',s:'✌️'};const b=document.getElementById('rps-battle');const r=document.getElementById('rps-result');if(b)b.innerHTML=`${icons[choice]}<span class="rps-vs">VS</span>${icons[cpu]}`;let res='';if(choice===cpu){rpsScore.d++;res='<span class="draw">Berabere! 🤝</span>';}else if((choice==='r'&&cpu==='s')||(choice==='p'&&cpu==='r')||(choice==='s'&&cpu==='p')){rpsScore.w++;res='<span class="win">Kazandın! 🎉</span>';}else{rpsScore.l++;res='<span class="lose">Kaybettin! 😔</span>';}if(r)r.innerHTML=res;const w=document.getElementById('rps-w'),d=document.getElementById('rps-d'),l=document.getElementById('rps-l');if(w)w.textContent=rpsScore.w;if(d)d.textContent=rpsScore.d;if(l)l.textContent=rpsScore.l;}
function resetRPS(){rpsScore={w:0,l:0,d:0};buildRPS(document.getElementById('game-container'));}
/* KEYBOARD & TOUCH */
document.addEventListener('keydown',e=>{
  if(currentGame==='2048'){const m={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down'};if(m[e.key]){e.preventDefault();move2048(m[e.key]);}}
  if(currentGame==='tetris'){if(e.key==='ArrowLeft')tetMove(-1);else if(e.key==='ArrowRight')tetMove(1);else if(e.key==='ArrowUp')rotateTet();else if(e.key==='ArrowDown')tetDrop();}
  if(currentGame==='snake'){const m={ArrowLeft:{x:-1,y:0},ArrowRight:{x:1,y:0},ArrowUp:{x:0,y:-1},ArrowDown:{x:0,y:1}};if(m[e.key]){e.preventDefault();const d=m[e.key];snDir(d.x,d.y);}}
});
let tx=0,ty=0;
document.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY;},{passive:true});
document.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;
  if(Math.max(Math.abs(dx),Math.abs(dy))<25)return;
  const horiz=Math.abs(dx)>Math.abs(dy);
  if(currentGame==='2048'){if(horiz)move2048(dx>0?'right':'left');else move2048(dy>0?'down':'up');}
  if(currentGame==='snake'){if(horiz)snDir(dx>0?1:-1,0);else snDir(0,dy>0?1:-1);}
},{passive:true});
window.addEventListener('DOMContentLoaded',()=>{const saved=localStorage.getItem('bear_lang');if(saved)setLang(saved);});
</script>
